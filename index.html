<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>양도소득세 보유기간 시뮬레이터</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 24px; color: #111; }
    h1 { margin-bottom: 8px; }
    .note { color: #555; font-size: 14px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    label { display: flex; flex-direction: column; font-size: 14px; gap: 6px; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    .checks { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 16px; }
    button { background: #0064ff; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
    button:hover { background: #0054d8; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border-bottom: 1px solid #ececec; padding: 8px; text-align: right; font-size: 14px; }
    th:first-child, td:first-child { text-align: center; }
    th:nth-child(2), td:nth-child(2) { text-align: center; }
    .summary { margin-top: 14px; padding: 12px; border-radius: 8px; background: #f5f8ff; }
  </style>
</head>
<body>
  <h1>한국 아파트 양도소득세 보유기간 시뮬레이터 (MVP)</h1>
  <p class="note">사용자 제공 규칙 기반 간이 계산기입니다. 실제 신고 전에는 반드시 최신 세법/전문가 검토가 필요합니다.</p>

  <div class="grid">
    <label>양도가액(원)
      <input id="salePrice" type="number" value="1500000000" />
    </label>
    <label>취득가액(원)
      <input id="buyPrice" type="number" value="900000000" />
    </label>
    <label>필요경비(원)
      <input id="expenses" type="number" value="20000000" />
    </label>
    <label>기본공제(원)
      <input id="basicDeduction" type="number" value="2500000" />
    </label>
    <label>시작 보유연수(년)
      <input id="startHoldingYears" type="number" value="1" min="0" max="40" />
    </label>
    <label>시뮬레이션 기간(년)
      <input id="simulateYears" type="number" value="10" min="1" max="30" />
    </label>
    <label>현재 거주연수(년)
      <input id="startResidenceYears" type="number" value="1" min="0" max="40" />
    </label>
    <label>자산유형
      <select id="assetType">
        <option value="house">주택(아파트 포함)</option>
        <option value="land_building">토지·건물</option>
        <option value="other">기타 부동산</option>
      </select>
    </label>
  </div>

  <div class="checks">
    <label><input type="checkbox" id="isOneHome" checked /> 1세대 1주택</label>
    <label><input type="checkbox" id="applyHighPriceExemption" checked /> 12억 비과세(고가주택 과세대상분) 반영</label>
    <label><input type="checkbox" id="includeLocalTax" checked /> 지방소득세(10%) 포함</label>
  </div>

  <button id="runBtn">시뮬레이션 실행</button>

  <div class="summary" id="summary"></div>
  <table id="resultTable">
    <thead>
      <tr>
        <th>보유연수</th>
        <th>장특공율</th>
        <th>과세표준(원)</th>
        <th>국세(원)</th>
        <th>지방세(원)</th>
        <th>최종세액(원)</th>
        <th>직전 대비 절세(원)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const KRW = new Intl.NumberFormat('ko-KR');

    function getProgressiveTax(base) {
      if (base <= 0) return 0;
      const brackets = [
        { limit: 14000000, rate: 0.06, deduction: 0 },
        { limit: 50000000, rate: 0.15, deduction: 1260000 },
        { limit: 88000000, rate: 0.24, deduction: 5760000 },
        { limit: 150000000, rate: 0.35, deduction: 15440000 },
        { limit: 300000000, rate: 0.38, deduction: 19940000 },
        { limit: 500000000, rate: 0.40, deduction: 25940000 },
        { limit: 1000000000, rate: 0.42, deduction: 35940000 },
        { limit: Infinity, rate: 0.45, deduction: 65940000 },
      ];

      const row = brackets.find((b) => base <= b.limit);
      return Math.max(0, base * row.rate - row.deduction);
    }

    function getShortTermRate(assetType, holdingYears) {
      if (assetType === 'house') {
        if (holdingYears < 1) return 0.70;
        if (holdingYears < 2) return 0.60;
      }
      if (assetType === 'other' || assetType === 'land_building') {
        if (holdingYears < 1) return 0.50;
        if (holdingYears < 2) return 0.40;
      }
      return null;
    }

    function getLongTermDeductionRate({ assetType, holdingYears, residenceYears, isOneHome }) {
      if (assetType === 'land_building' || (assetType === 'other')) {
        if (holdingYears < 3) return 0;
        return Math.min(30, holdingYears * 2); // 3년=6%, 4년=8%...
      }

      // 주택
      if (isOneHome) {
        const holdRate = holdingYears >= 3 ? Math.min(40, holdingYears * 4) : 0; // 3년=12% 가정
        const resRate = residenceYears >= 2 ? Math.min(40, residenceYears * 4) : 0; // 2년=8% 가정
        return Math.min(80, holdRate + resRate);
      }

      if (holdingYears < 3) return 0;
      return Math.min(30, holdingYears * 2);
    }

    function calculateForYear(yearOffset) {
      const salePrice = Number(document.getElementById('salePrice').value);
      const buyPrice = Number(document.getElementById('buyPrice').value);
      const expenses = Number(document.getElementById('expenses').value);
      const basicDeduction = Number(document.getElementById('basicDeduction').value);
      const startHoldingYears = Number(document.getElementById('startHoldingYears').value);
      const startResidenceYears = Number(document.getElementById('startResidenceYears').value);
      const assetType = document.getElementById('assetType').value;
      const isOneHome = document.getElementById('isOneHome').checked;
      const applyHighPriceExemption = document.getElementById('applyHighPriceExemption').checked;
      const includeLocalTax = document.getElementById('includeLocalTax').checked;

      const holdingYears = startHoldingYears + yearOffset;
      const residenceYears = startResidenceYears + yearOffset;
      const rawGain = Math.max(0, salePrice - buyPrice - expenses);

      let taxableGain = rawGain;
      if (assetType === 'house' && isOneHome && applyHighPriceExemption) {
        const NON_TAX_LIMIT = 1200000000;
        if (salePrice <= NON_TAX_LIMIT && holdingYears >= 2) {
          taxableGain = 0;
        } else if (salePrice > NON_TAX_LIMIT) {
          const taxablePortion = (salePrice - NON_TAX_LIMIT) / salePrice;
          taxableGain = rawGain * taxablePortion;
        }
      }

      const ltRate = getLongTermDeductionRate({ assetType, holdingYears, residenceYears, isOneHome });
      const ltDeduction = taxableGain * (ltRate / 100);
      const taxBase = Math.max(0, taxableGain - ltDeduction - basicDeduction);

      const shortTermRate = getShortTermRate(assetType, holdingYears);
      const nationalTax = shortTermRate !== null
        ? taxBase * shortTermRate
        : getProgressiveTax(taxBase);

      const localTax = includeLocalTax ? nationalTax * 0.1 : 0;
      const totalTax = nationalTax + localTax;

      return { holdingYears, ltRate, taxBase, nationalTax, localTax, totalTax, taxableGain };
    }

    function runSimulation() {
      const years = Number(document.getElementById('simulateYears').value);
      const tbody = document.querySelector('#resultTable tbody');
      tbody.innerHTML = '';

      const rows = [];
      for (let i = 0; i < years; i++) rows.push(calculateForYear(i));

      rows.forEach((r, idx) => {
        const prev = idx > 0 ? rows[idx - 1].totalTax : null;
        const saved = prev !== null ? Math.max(0, prev - r.totalTax) : 0;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.holdingYears}년</td>
          <td>${r.ltRate.toFixed(1)}%</td>
          <td>${KRW.format(Math.round(r.taxBase))}</td>
          <td>${KRW.format(Math.round(r.nationalTax))}</td>
          <td>${KRW.format(Math.round(r.localTax))}</td>
          <td><strong>${KRW.format(Math.round(r.totalTax))}</strong></td>
          <td>${idx === 0 ? '-' : KRW.format(Math.round(saved))}</td>
        `;
        tbody.appendChild(tr);
      });

      const first = rows[0];
      const last = rows[rows.length - 1];
      document.getElementById('summary').innerHTML = `
        <strong>요약:</strong> 시작 시점 대비 ${last.holdingYears - first.holdingYears}년 추가 보유 시,
        예상 세액은 <strong>${KRW.format(Math.round(first.totalTax))}원 → ${KRW.format(Math.round(last.totalTax))}원</strong>,
        총 <strong>${KRW.format(Math.round(Math.max(0, first.totalTax - last.totalTax)))}원</strong> 절세(가정 고정 기준).
      `;
    }

    document.getElementById('runBtn').addEventListener('click', runSimulation);
    runSimulation();
  </script>
</body>
</html>
